# Producao. Jeito recomendado (do seu computador, um comando): ./scripts/deploy.sh
#   - monta as imagens aqui, envia ao servidor e sobe tudo; o servidor nao precisa do codigo-fonte.
# Alternativa (servidor com o codigo e memoria de sobra para montar as imagens):
#   cp deploy/.env.prod.example .env      # e preencha
#   docker compose -f docker-compose.prod.yml up -d --build
# So o container "web" (Caddy) expoe portas (80/443). Banco, API e IA ficam na rede interna.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vitta
      POSTGRES_USER: vitta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitta"]
      interval: 5s
      retries: 10

  ai:
    image: vitta-ai:latest
    build: ./src/Vitta.AI
    restart: unless-stopped
    environment:
      VITTA_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VITTA_AI_GROQ_API_KEY: ${GROQ_API_KEY:-}
      VITTA_AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}

  api:
    image: vitta-api:latest
    build:
      context: .
      dockerfile: src/Vitta.API/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Vitta: Host=postgres;Port=5432;Database=vitta;Username=vitta;Password=${POSTGRES_PASSWORD}
      AiService__BaseUrl: http://ai:8000
      Auth__Jwt__Key: ${JWT_KEY:?defina JWT_KEY no .env}
      Auth__SeedAdmin__Name: ${ADMIN_NAME:-Administrador}
      Auth__SeedAdmin__Email: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      Auth__SeedAdmin__Password: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      Cors__Origins__0: https://${VITTA_DOMAIN}
      TZ: America/Sao_Paulo
      # E-mail diario (Configuracoes > E-mail diario). Hostinger: smtp.hostinger.com, porta 587.
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__From: ${SMTP_FROM:-}
      Email__AppUrl: https://${VITTA_DOMAIN}

  backup:
    image: vitta-backup:latest
    build: ./deploy/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - ./backups:/backups
      - ./deploy/backup/rclone:/config/rclone

  web:
    image: vitta-web:latest
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITTA_DOMAIN: ${VITTA_DOMAIN:?defina VITTA_DOMAIN no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
