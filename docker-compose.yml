# Opcional: em dev o padrao e SQLite. Use este Postgres para testar como em producao (npm run dev:pg).
services:
  postgres:
    image: postgres:17-alpine
    container_name: vitta-postgres
    environment:
      POSTGRES_DB: vitta
      POSTGRES_USER: vitta
      POSTGRES_PASSWORD: vitta
    ports:
      - "5433:5432"
    volumes:
      - vitta-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitta"]
      interval: 5s
      retries: 10

  ai:
    build: ./src/Vitta.AI
    container_name: vitta-ai
    profiles: ["ai"] # sobe apenas com: docker compose --profile ai up -d
    env_file:
      - path: ./src/Vitta.AI/.env
        required: false
    ports:
      - "8000:8000"

volumes:
  vitta-pgdata:
