<div class="page-header">
  <h1>Novo cliente</h1>
  <a class="btn" routerLink="/clientes">Voltar</a>
</div>

<form class="card" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-grid">
    <label>Nome completo *
      <input formControlName="fullName" autocomplete="name" />
    </label>
    <label>CPF *
      <input formControlName="cpf" inputmode="numeric" placeholder="000.000.000-00" />
    </label>
    <label>Data de nascimento
      <input type="date" formControlName="birthDate" />
    </label>
    <label>E-mail
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>Telefone / WhatsApp
      <input type="tel" formControlName="phone" autocomplete="tel" />
    </label>
  </div>

  @if (error(); as message) {
    <p class="error">{{ message }}</p>
  }

  <p>
    <button class="btn btn--primary" type="submit" [disabled]="saving()">
      {{ saving() ? 'Salvando…' : 'Salvar' }}
    </button>
  </p>
</form>
