<header class="topbar">
  <button class="icon-btn" type="button" (click)="toggleMenu()" aria-label="Abrir menu">
    <vt-icon name="menu" [size]="22" />
  </button>
  <vt-logo [size]="30" />
  <span class="avatar avatar--sm" [title]="user()?.name ?? ''">{{ initials() }}</span>
</header>

<aside class="sidebar" [class.open]="menuOpen()">
  <div class="sidebar__brand">
    <vt-logo [size]="36" />
    <button class="icon-btn close" type="button" (click)="closeMenu()" aria-label="Fechar menu">
      <vt-icon name="x" [size]="20" />
    </button>
  </div>

  <nav aria-label="Menu principal">
    @for (group of groups; track group.title) {
      <div class="group">
        @if (group.title) { <span class="group__title">{{ group.title }}</span> }
        @for (item of group.items; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
            <vt-icon [name]="item.icon" [size]="18" />
            <span>{{ item.label }}</span>
          </a>
        }
      </div>
    }
  </nav>

  <div class="sidebar__footer">
    <a class="settings" [routerLink]="settings.path" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="closeMenu()">
      <vt-icon [name]="settings.icon" [size]="18" />
      <span>{{ settings.label }}</span>
    </a>

  <div class="sidebar__user">
    <span class="avatar">{{ initials() }}</span>
    <div class="who">
      <strong>{{ user()?.name }}</strong>
      <small>{{ user()?.email }}</small>
    </div>
    <button class="icon-btn" type="button" (click)="logout()" title="Sair" aria-label="Sair">
      <vt-icon name="logout" [size]="19" />
    </button>
  </div>
  </div>
</aside>

@if (menuOpen()) {
  <div class="backdrop" (click)="closeMenu()"></div>
}

<main class="content">
  <router-outlet />
</main>
